  <!-- диагностика запуска: ошибки и шаги загрузки. С ?debug=1 в адресе — панель поверх страницы.
       Если сценарий не стартовал за 12 с — вместо пустого экрана сообщение с кнопкой «Обновить» и контактами -->
  <script>
    (function () {
      var t0 = Date.now(), errs = [], steps = [], dbg = /[?&]debug\b/.test(location.search);
      var sec = function () { return ((Date.now() - t0) / 1000).toFixed(1) + ' с'; };
      window.__drinknitStep = function (s) { steps.push(sec() + ' ' + s); };
      addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) errs.push(sec() + ' не загрузилось: ' + String(t.src || t.href).split('/').pop());
        else errs.push(sec() + ' ' + (e.message || 'ошибка') + ' — ' + String(e.filename || '').split('/').pop().split('?')[0] + ':' + e.lineno + ':' + e.colno);
      }, true);
      addEventListener('unhandledrejection', function (e) { errs.push(sec() + ' promise: ' + (e.reason && (e.reason.message || e.reason))); });
      var started = function () { return document.body && document.body.classList.contains('intro') || document.body && document.body.classList.contains('is-done'); };
      setTimeout(function () {
        if (started() || !document.body) return;
        var C = (window.DRINKNIT_CONTENT || {}).config || {}, L = C.links || {};
        var tg = L.telegram || 'https://t.me/katarios03', vk = L.vk || 'https://vk.me/katarios03';
        var d = document.createElement('div');
        d.id = 'boot-fail';
        d.setAttribute('style', 'position:fixed;inset:0;z-index:2147483647;background:#002510;color:#ffedc8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;font:500 16px/1.45 Manrope,system-ui,sans-serif');
        d.innerHTML = '<p style="font:700 22px/1.3 Comfortaa,system-ui,sans-serif;margin:0">Страница не загрузилась до конца</p>' +
          '<p style="margin:0;opacity:.8;max-width:320px">Попробуйте обновить страницу. Если не помогло — напишите мне, расскажу про наборы в переписке.</p>' +
          '<button type="button" onclick="location.reload()" style="font:700 16px Manrope,system-ui,sans-serif;color:#002510;background:#ffedc8;border:0;border-radius:100px;padding:14px 28px">Обновить страницу</button>' +
          '<p style="margin:0"><a style="color:#ffedc8" href="' + tg + '">Telegram</a> · <a style="color:#ffedc8" href="' + vk + '">ВКонтакте</a></p>';
        document.body.appendChild(d);
        document.documentElement.classList.add('flow-ready');   // убираем заливку с индикатором загрузки
        window.__drinknitStep('не стартовал за 12 с — показано сообщение');
      }, 12000);
      if (!dbg) return;
      var box;
      setInterval(function () {
        if (!document.body) return;
        if (!box) { box = document.createElement('pre'); document.body.appendChild(box); box.setAttribute('style', 'position:fixed;left:0;right:0;top:0;max-height:70vh;overflow:auto;z-index:2147483647;margin:0;padding:8px;background:rgba(0,0,0,.88);color:#9f9;font:11px/1.35 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all'); }
        if (box.nextSibling) document.body.appendChild(box);   // панель всегда поверх всего
        var h = document.documentElement, b = document.body;
        var res = (performance.getEntriesByType ? performance.getEntriesByType('resource') : []).filter(function (r) { return /\.(js|css)(\?|$)|fonts\.|box-closed/.test(r.name); })
          .map(function (r) { return '  ' + r.name.split('/').pop().split('?')[0].slice(0, 28) + ' ' + Math.round(r.startTime) + '→' + Math.round(r.responseEnd) + ' мс, ' + Math.round((r.transferSize || 0) / 1024) + ' КБ' + (r.responseStatus ? ' [' + r.responseStatus + ']' : ''); });
        box.textContent = 'DRINKNIT DEBUG ' + sec() + '\n' + navigator.userAgent + '\n' +
          'экран ' + innerWidth + '×' + innerHeight + ' dpr ' + devicePixelRatio + ' · ' + document.readyState + '\n' +
          'html: ' + h.className + '\nbody: ' + b.className + '\n' +
          'content ' + !!window.DRINKNIT_CONTENT + ' · texts ' + !!window.DrinknitTexts + ' · analytics ' + !!window.DrinknitAnalytics + ' · half ' + !!window.DRINKNIT_HALF + ' · started ' + started() + '\n' +
          'шаги:\n  ' + steps.join('\n  ') + '\nфайлы:\n' + res.join('\n') + '\nошибки:\n  ' + (errs.join('\n  ') || 'нет');
      }, 1000);
    })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <!-- десктоп и мобильная версия: разные стили и скрипты, переключение по ширине и ориентации окна -->
  <script>
    (function () {
            var isM = function () { return innerWidth / innerHeight < 1; };   // вертикальное окно — вертикальный кадр
      var m = isM();
      window.__drinknitMode = m ? 'm' : 'd';
      document.documentElement.classList.add(m ? 'is-p' : 'is-d');
      // стили страницы блокируют первую отрисовку (blocking=render): без них раскладка «прыгала» (сдвиг макета в PageSpeed)
      var add = function (rel, href, as) { var l = document.createElement('link'); l.rel = rel; l.href = href; if (as) l.as = as; if (rel === 'stylesheet') l.setAttribute('blocking', 'render'); document.head.appendChild(l); };
      // скрипты страницы — сразу и с высоким приоритетом, раньше картинок: на медленной сети страница не ждёт, пока догрузятся фото
      ['texts.js', 'boot.js', 'analytics.js', 'data.js', 'imgsizes.js', 'desktop.js'].forEach(function (f) {
        var l = document.createElement('link'); l.rel = 'preload'; l.as = 'script'; l.href = f + '?v=20261105t'; l.setAttribute('fetchpriority', 'high'); document.head.appendChild(l);
      });
      add('stylesheet', 'desktop.css?v=20261105t');
      // телефон и вертикальный планшет: те же блоки и анимации в вертикальном кадре
      if (m) add('stylesheet', 'portrait.css?v=20261105t');
      var t;
      addEventListener('resize', function () { clearTimeout(t); t = setTimeout(function () { if (isM() !== m) location.reload(); }, 250); });
    })();
  </script>
  <style>html { background: #002510; }
    /* до первой раскладки страницу закрывает зелёная заливка: неразложенные блоки (вопросы поверх всего) не видны никогда.
       Сама страница под заливкой видима (не opacity: 0) — так браузер и PageSpeed засчитывают отрисовку первого экрана (LCP).
       Если загрузка идёт дольше секунды — на заливке крутится индикатор */
    html:not(.flow-ready)::before { content: ''; position: fixed; inset: 0; z-index: 2147483646; background: #002510; }
    html:not(.flow-ready)::after {
      content: ''; position: fixed; z-index: 2147483647; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%;
      border: 3px solid rgba(255, 237, 200, .2); border-top-color: #ffedc8; opacity: 0;
      animation: bootSpin .9s linear infinite, bootIn .3s ease 1s forwards;
    }
    @keyframes bootSpin { to { transform: rotate(360deg); } }
    @keyframes bootIn { to { opacity: 1; } }</style>

  <script>
    (function () {
      var tpl = document.getElementById('tpl-desktop').content;
      // картинки дальних блоков не качаются, пока не запустился сценарий: на медленной сети канал сначала
      // отдаётся скриптам и первому экрану. Сценарий включает их сразу после старта (пока подарок ждёт нажатия)
      var later = function () { [].forEach.call(document.querySelectorAll('img[data-src]'), function (im) { im.src = im.getAttribute('data-src'); im.removeAttribute('data-src'); }); };
      window.__drinknitImgs = later;
      [].forEach.call(tpl.querySelectorAll('img[src]'), function (im) {
        if (!im.closest('#hero, #header, #idle-hint')) { im.setAttribute('data-src', im.getAttribute('src')); im.removeAttribute('src'); }
      });
      document.body.appendChild(tpl);
      if (window.__drinknitStep) __drinknitStep('разметка добавлена, грузим скрипты');
      // скрипты грузятся параллельно, а выполняются строго по порядку (async = false):
      // содержимое из админки → тексты на странице → данные → сценарий страницы.
      // Если какой-то файл не загрузился, остальные всё равно выполняются — страница не зависает
      var load = function (src) { var s = document.createElement('script'); s.src = src; s.async = false; s.setAttribute('fetchpriority', 'high'); document.body.appendChild(s); };
      // сначала браузер рисует подарок первого экрана, потом выполняются скрипты (скачиваются они уже сейчас — preload в head):
      // так главный элемент экрана появляется, не дожидаясь работы скриптов (LCP в PageSpeed)
      var run = function () {
        if (run.done) return; run.done = true;
        load('content.js?t=' + Date.now());
        load('texts.js?v=20261105t');
        load('boot.js?v=20261105t');
        load('analytics.js?v=20261105t');
        load('data.js?v=20261105t');
        load('imgsizes.js?v=20261105t');
        load('desktop.js?v=20261105t');
      };
      var afterPaint = function () { requestAnimationFrame(function () { setTimeout(run, 0); }); };
      var gift = document.querySelector('.closed img');
      if (gift && !gift.complete) { gift.addEventListener('load', afterPaint); gift.addEventListener('error', afterPaint); setTimeout(run, 1500); }
      else afterPaint();
      // последняя страховка: если сценарий так и не запустился за 30 с, показываем страницу как есть
      setTimeout(function () { document.documentElement.classList.add('flow-ready'); later(); }, 30000);
    })();
  </script>
