<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Drinknit — новогодние наборы с вязаными игрушками</title>
  <meta name="description" content="Новогодние наборы с вязаными игрушками ручной работы. Свяжу, упакую и подпишу открытку вашим текстом. Три набора: 900, 1 700 и 2 400 ₽.">
  <meta name="theme-color" content="#0b3a20">
  <meta property="og:title" content="Drinknit — новогодние наборы с вязаными игрушками">
  <meta property="og:description" content="Свяжу, упакую и подпишу открытку вашим текстом. До Нового года успею сделать только 10.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- десктоп и мобильная версия: разные стили и скрипты, переключение по ширине и ориентации окна -->
  <script>
    (function () {
            var isM = function () { return innerWidth / innerHeight < 1; };   // вертикальное окно — вертикальный кадр
      var m = isM();
      window.__drinknitMode = m ? 'm' : 'd';
      document.documentElement.classList.add(m ? 'is-p' : 'is-d');
      var add = function (rel, href, as) { var l = document.createElement('link'); l.rel = rel; l.href = href; if (as) l.as = as; document.head.appendChild(l); };
      add('preload', 'assets/box-closed.webp', 'image'); add('stylesheet', 'desktop.css');
      // телефон и вертикальный планшет: те же блоки и анимации в вертикальном кадре
      if (m) add('stylesheet', 'portrait.css');
      var t;
      addEventListener('resize', function () { clearTimeout(t); t = setTimeout(function () { if (isM() !== m) location.reload(); }, 250); });
    })();
  </script>
  <style>html { background: #002510; }</style>
</head>
<body>
  <!-- ============ десктопная версия по новому макету ============ -->
  <template id="tpl-desktop">


<!-- подсказка «листайте дальше»: появляется, если посетитель не прокручивает страницу больше 4 секунд -->
<div class="idle-hint" id="idle-hint" aria-hidden="true"><svg viewBox="0 -1 42 44" width="42" height="42"><path class="ch ch1" d="M10.88 .38a1.31 1.31 0 0 1 1.86 0l7.82 7.83 7.82-7.83a1.31 1.31 0 0 1 1.86 1.86l-8.75 8.75a1.31 1.31 0 0 1-1.86 0l-8.75-8.75a1.31 1.31 0 0 1 0-1.86z"/><path class="ch ch2" d="M10.88 15.42a1.31 1.31 0 0 1 1.86 0l7.82 7.82 7.82-7.82a1.31 1.31 0 0 1 1.86 1.85l-8.75 8.75a1.31 1.31 0 0 1-1.86 0l-8.75-8.75a1.31 1.31 0 0 1 0-1.85z"/><path class="ch ch3" d="M10.88 31.38a1.31 1.31 0 0 1 1.86 0l7.82 7.83 7.82-7.83a1.31 1.31 0 0 1 1.86 1.86l-8.75 8.75a1.31 1.31 0 0 1-1.86 0l-8.75-8.75a1.31 1.31 0 0 1 0-1.86z"/></svg></div>
<div class="vp" id="vp">
<div id="stage">

  <!-- Шапка: после начала скролла переходит в компактный вариант -->
<header id="header">
  <div class="hd">
    <a class="hd-logo ui" style="--d:0s" href="#hero" data-nav>
      <img src="assets/d/logo.svg" width="198" height="112" alt="Drinknit">
      <span>Вещи ручной работы</span>
    </a>
    <nav class="hd-nav glass-dark ui" style="--d:.1s">
      <a href="#sets" data-nav>Наборы</a>
      <a href="#kids" data-nav>Для детей</a>
      <a href="#terms" data-nav>Сроки</a>
      <a href="#book" data-nav>Забронировать набор</a>
    </nav>
    <div class="hd-right ui" style="--d:.08s">
      <button class="hd-sound glass-dark js-sound" type="button" aria-label="Музыка играет" aria-pressed="true">
        <img class="ic-on" src="assets/d/ic-sound-on.svg" width="24" height="24" alt=""><img class="ic-off" src="assets/d/ic-sound-off.svg" width="24" height="24" alt="">
      </button>
    </div>
  </div>
  <!-- второй вариант шапки: после начала скролла -->
  <div class="hd2">
    <a class="hd2-logo" href="#hero" data-nav tabindex="-1">
      <img src="assets/d/logo.svg" width="81" height="46" alt="Drinknit">
      <span>Вещи ручной работы</span>
    </a>
    <div class="hd2-mid">
      <nav class="hd2-nav glass-dark">
        <a href="#sets" data-nav tabindex="-1">Наборы</a>
        <a href="#kids" data-nav tabindex="-1">Для детей</a>
        <a href="#terms" data-nav tabindex="-1">Сроки</a>
      </nav>
      <a class="hd2-book" href="#book" data-nav tabindex="-1">Забронировать набор</a>
    </div>
    <div class="hd2-right">
      <button class="hd-sound glass-dark js-sound" type="button" tabindex="-1" aria-label="Музыка играет" aria-pressed="true">
        <img class="ic-on" src="assets/d/ic-sound-on.svg" width="24" height="24" alt=""><img class="ic-off" src="assets/d/ic-sound-off.svg" width="24" height="24" alt="">
      </button>
      <!-- меню разделов: только на телефоне -->
      <button class="hd-menu glass-dark" type="button" tabindex="-1" aria-label="Меню" aria-expanded="false" aria-controls="mnav">
        <img src="assets/d/ic-menu.svg" width="20" height="20" alt="">
      </button>
    </div>
  </div>
  <nav class="mnav glass-dark" id="mnav" aria-label="Разделы" hidden>
    <a href="#sets" data-nav>Наборы</a>
    <a href="#kids" data-nav>Для детей</a>
    <a href="#terms" data-nav>Сроки и доставка</a>
    <a href="#faq" data-nav>Частые вопросы</a>
    <a class="mnav-book" href="#book" data-nav>Забронировать набор</a>
  </nav>
</header>


  <!-- 1. Первый экран -->
  <section id="hero" class="scr bg-green"><div class="fr">
    <div class="glow" aria-hidden="true"></div>
    <div class="rays" aria-hidden="true"></div>
    <img class="gift-shadow" src="assets/d/gift-shadow.svg" alt="" aria-hidden="true">
    <div class="closed"><img src="assets/box-closed.webp" alt=""><button class="gift-hit" id="gift" type="button" aria-label="Открыть подарок"></button></div>
    <div class="gift-hint" aria-hidden="true">
      <img class="gift-hint-bubble" src="assets/d/hint-bubble.svg" alt="">
      <p class="gift-hint-text">Нажми на подарок</p>
      <div class="gift-hint-goat"><div class="stk-r" style="width:303.299px;height:334.416px;transform:rotate(-171.02deg) scaleY(-1)"><i><img src="assets/d/sheet-5pryb.webp" alt="" style="left:0;top:0;width:283.02%;height:191.66%"></i></div></div>
    </div>
    <img class="hero-ray" src="assets/d/hero-ray.svg" alt="">
    <img class="hero-ellipse" src="assets/d/hero-ellipse.svg" alt="">
    <div class="hero-fade bgl"></div>
    <div class="hero-content">
      <div class="chip ui" style="--d:.2s"><img src="assets/d/ic-gift.svg" width="24" height="24" alt=""><span>Свободно <b data-free>10</b> из <b data-total>10</b> наборов</span></div>
      <h1 class="h1 ui" style="--d:.3s">Новогодние наборы<br>с вязаными игрушками ручной работы</h1>
      <div class="row-btns ui" style="--d:.55s">
        <a class="btn btn-red" href="#sets" data-nav>Выбрать набор</a>
        <a class="btn btn-glass" href="#" data-msg="telegram">Написать мне</a>
      </div>
    </div>
    <div class="stickers" data-set="hero"></div>
  </div></section>

  <!-- 2. Наборы -->
  <section id="sets" class="scr bg-green b2"><div class="fr">
    <img class="b2-bg b2-el bgl" style="--d:0" src="assets/d/sets-bg.webp" alt="">
    <div class="b2-topshade b2-el" style="--d:0" aria-hidden="true"></div>
    <h2 class="h2 b2-title b2-el" style="--d:.1">Три набора:<br>выберите для того,<br class="br-p"> кому дарите</h2>
    <div class="set-panel glass-dark b2-el" style="--d:.25">
      <p class="set-panel-title">Выберите набор</p>
      <div class="set-tabs" role="tablist">
        <button type="button" role="tab" data-set-tab="S">Набор S</button>
        <button type="button" role="tab" data-set-tab="M">Набор M</button>
        <button type="button" role="tab" data-set-tab="L">Набор L</button>
      </div>
      <div class="set-desc">
        <p data-set-for></p>
        <p data-set-hours></p>
      </div>
      <div class="set-buy">
        <p class="set-price"><span data-set-price></span> ₽</p>
        <a class="btn btn-red" href="#" data-msg="telegram" data-set-btn></a>
      </div>
    </div>
    <div class="hint b2-el" style="--d:.45">
      <img class="hint-bubble" src="assets/d/bubble.svg" alt="">
      <div class="hint-goat"><div class="stk-r" style="width:286.17px;height:332.861px;transform:rotate(-165.17deg) scaleY(-1)"><i><img src="assets/d/st-goatbox.webp" alt="" style="left:0;top:-11.43%;width:269.47%;height:231.67%"></i></div></div>
      <p class="hint-text">Кликните на предмет,<br>чтобы узнать подробнее</p>
    </div>
    <div class="dim bgl" id="dim"></div>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
      <div class="modal-info">
        <h3 class="modal-title" id="modal-title"></h3>
        <div class="modal-bottom">
          <p class="modal-text" id="modal-text"></p>
          <p class="modal-note" id="modal-note"></p>
        </div>
      </div>
      <div class="modal-photo">
        <div class="modal-img" id="modal-img"></div>
        <div class="modal-arrows">
          <button type="button" class="arr arr-prev" data-photo="-1" aria-label="Предыдущее фото"><img src="assets/d/arrow.webp" alt=""></button>
          <button type="button" class="arr" data-photo="1" aria-label="Следующее фото"><img src="assets/d/arrow.webp" alt=""></button>
        </div>
      </div>
      <button type="button" class="modal-close" id="modal-close" aria-label="Закрыть"><img src="assets/d/ic-close.svg" alt=""></button>
    </div>
  </div></section>

  <!-- Продукт: один слой на два экрана. Едет со скроллом из первого экрана во второй -->
  <div id="product" aria-label="Набор: нажмите на предмет, чтобы узнать подробнее">
    <div class="prod-inner"></div>
  </div>

  <!-- 3. Сколько вяжу: высокий блок, экран спускается от заголовка к домику, потом листаются три карточки -->
  <section id="time" class="scr scene b3"><div class="fr">
    <!-- фон едет вместе со скроллом -->
    <div class="b3-world" id="b3-bg">
      <div class="b3-l01 bgl"><img src="assets/d/b3-01.webp" alt="" data-d="6"><img class="b3-l01m" src="assets/d/m-b3-bg.webp" alt="" loading="lazy"></div>
    </div>
    <!-- переход в блок 4: кадры видео, сменяются при скролле -->
    <canvas class="b3-video" id="b3-video" aria-hidden="true" data-d="6"></canvas>
    <div class="b3-vshade" id="b3-vshade" aria-hidden="true"></div>
    <!-- ветки справа и слева стоят на месте -->
    <img class="b3-l02 bgl b3-fade" src="assets/d/b3-02.webp" alt="" data-d="14">
    <img class="b3-l03 bgl b3-fade" src="assets/d/b3-03.webp" alt="" data-d="26">
    <!-- заголовок стоит на месте и гаснет при скролле -->
    <div class="b3-topshade" aria-hidden="true"></div>
    <div class="b3-textwrap" id="b3-textwrap">
      <div class="b3-text rv" style="--d:.15s">
        <h2 class="h2">Маленькую игрушку<br>я вяжу 2 часа, среднюю 7 часов</h2>
        <p class="lead">Поэтому к Новому году <br>получится только 10 наборов, и все они будут немного разными</p>
      </div>
    </div>
    <div class="b3-world" id="b3-fg">
      <div class="b3-card-wrap" id="b3-card" data-d="10">
        <div class="stamp" id="flip">
          <div class="stamp-win"><img id="flip-img" src="assets/d/card-gingerbread.webp" alt=""></div>
          <p class="stamp-cap" id="flip-cap"></p>
        </div>
      </div>
    </div>
  </div></section>

  <!-- 4. Для детей -->
  <section id="kids" class="scr scene b4"><div class="fr">
    <img class="b4-bg bgl" src="assets/d/b4-bg1.webp" alt="" data-d="8">
    <img class="b4-bg bgl" src="assets/d/b4-bg2.webp" alt="" data-d="16">
    <div class="b4-shade" aria-hidden="true"></div>
    <div class="b4-shade2" aria-hidden="true"></div>
    <h2 class="h2 b4-title rv" style="--d:.2s">Можно дарить детям:<br>глазки и мелкие детали держатся на безопасном креплении</h2>
    <div class="stickers" data-set="kids"></div>
    <div class="b4-bubble rv noblur" style="--d:.45s" data-d="12">
      <img class="b4-bubble-d" src="assets/d/b4-bubble.svg" alt="">
      <img class="b4-bubble-m" src="assets/d/m-kids-bubble.svg" alt="">
      <p>Пряжа гипоаллергенная: [какой хлопок и акрил, производитель].<br>Мелкие детали [пришиты или на безопасных замках], их не оторвать руками.<br>Подходит детям с [возраст].<br>Стирка: [ручная, 30°, как сушить].</p>
    </div>
  </div></section>

  <!-- 5. Осталось наборов и таймер. Жёсткий параллакс: объекты стоят, экран скроллится -->
  <section id="left" class="scr scene bg-green b5"><div class="fr">
    <div class="pin" id="pin">
      <div class="stickers" data-set="left"></div>
      <div class="b5-center">
        <div class="b5-panel glass-dark rv" style="--d:.35s">
          <p class="b5-left">Осталось<br><span data-free>10</span> из <span data-total>10</span> наборов</p>
          <div class="b5-and"><img src="assets/d/line.svg" alt=""><span>и</span><img src="assets/d/line.svg" alt=""></div>
          <div class="b5-timer">
            <p class="b5-days" id="t-days">— дней,</p>
            <p class="b5-hm" id="t-hm">— часов, — минут</p>
            <p class="b5-cap">до окончания приёма заказов</p>
          </div>
        </div>
        <div class="b5-cta rv" style="--d:.55s">
          <a class="btn btn-red" href="#" data-msg="telegram">Забронировать набор</a>
          <p>Напишите, какой набор хотите и что подписать<br>на открытке. Остальное подскажу в переписке</p>
        </div>
      </div>
    </div>
  </div></section>

  <!-- 6. Сроки и как заказать -->
  <section id="terms" class="scr scene b6"><div class="fr">
    <img class="b6-bg b6-bg2 bgl" src="assets/d/b5-bg2.webp" alt="" data-d="8">
    <div class="b6-bg b6-bg1 bgl" data-d="16"><img src="assets/d/b5-bg1.webp" alt=""></div>
    <img class="b6-bg-m" src="assets/d/m-terms-bg.webp" alt="" loading="lazy">
    <div class="b6-topshade" aria-hidden="true"></div>
    <h2 class="h2 b6-title rv" style="--d:.2s">Чтобы набор успел<br>к празднику,<br>напишите до 25.12</h2>
    <div class="b6-shade" aria-hidden="true"></div>
    <div class="rv" style="--d:.4s"><img class="b6-bubble" src="assets/d/b5-bubble.svg" alt="" data-d="10"><img class="b6-bubble-m" src="assets/d/m-terms-bubble.svg" alt="">
    <ol class="b6-steps" data-d="10">
      <li>Напишите мне, какой набор хотите и какой текст написать на открытке.</li>
      <li>Я ставлю ваш набор в очередь. Вы вносите 100% предоплату за набор переводом на карту.</li>
      <li>Вяжу и собираю набор за 1–3 дня, в зависимости от размера набора.</li>
      <li>Получаете набор: самовывоз Нижний Новгород (район ТЦ Фантастика), Яндекс Доставка по городу или отправка по России (СДЭК / Яндекс / Озон / Почта). Доставку оплачиваете отдельно по тарифу службы.</li>
    </ol></div>
    <div class="stickers" data-set="terms"></div>
    <a class="btn btn-red b6-btn rv" style="--d:.6s" href="#" data-msg="telegram" data-d="10">Забронировать набор</a>
  </div></section>

  <!-- 7. Обо мне -->
  <section id="about" class="scr scene bg-green b7"><div class="fr">
    <h2 class="h2 b7-title rv" style="--d:.2s">Привет, я Катя,<br>вяжу игрушки 30 лет</h2>
    <div class="b7-card-wrap rv" data-split style="--d:.4s" data-d="10">
      <div class="stamp stamp-about" id="about-card">
        <div class="stamp-win"><img src="assets/d/katya.webp" alt="Катя, мастер"></div>
        <p class="stamp-cap">Первые игрушки я вязала по схемам<br>из журнала «Валентина».<br>Сейчас придумываю свои: идеи беру<br>из природы и ищу на небольших сайтах мастеров, куда редко заходят производители массовых игрушек.</p>
      </div>
    </div>
    <div class="stickers" data-set="about"></div>
  </div></section>

  <!-- 8. Финальный призыв -->
  <section id="book" class="scr scene b8"><div class="b8-fill bg-green" aria-hidden="true"></div><div class="fr">
    <div class="b8-cards">
      <div class="b8-card" data-card="0"><div class="b8-card-in" data-set-pick="S">
        <div class="stamp-win"><img class="w-bg" src="assets/d/card-bg.webp" alt=""><img class="w-prod" style="width:374px;height:279px;top:19px" src="assets/d/card-S.webp" alt="Набор S"></div>
        <p class="b8-name">Набор S</p><p class="b8-price"><span data-price="S"></span> ₽</p>
      </div></div>
      <div class="b8-card" data-card="1"><div class="b8-card-in" data-set-pick="M">
        <div class="stamp-win"><img class="w-bg" src="assets/d/card-bg.webp" alt=""><img class="w-prod" style="width:471.429px;height:352px;top:-13px" src="assets/d/card-M.webp" alt="Набор M"></div>
        <p class="b8-name">Набор M</p><p class="b8-price"><span data-price="M"></span> ₽</p>
      </div></div>
      <div class="b8-card" data-card="2"><div class="b8-card-in" data-set-pick="L">
        <div class="stamp-win"><img class="w-bg" src="assets/d/card-bg.webp" alt=""><img class="w-prod" style="width:476.786px;height:356px;top:-15px" src="assets/d/card-L.webp" alt="Набор L"></div>
        <p class="b8-name">Набор L</p><p class="b8-price"><span data-price="L"></span> ₽</p>
      </div></div>
    </div>
    <div class="b8-cta rv" style="--d:1s">
      <h2 class="h2 b8-title">Займите один из 10 наборов до 25.12</h2>
      <div class="b8-btns">
        <a class="btn btn-red" href="#" data-msg="telegram">Написать в Telegram</a>
        <a class="btn btn-red" href="#" data-msg="vk">Написать в ВК</a>
        <a class="btn btn-red" href="#" data-msg="max">Написать в MAX</a>
      </div>
      <a class="round glass-dark" href="#" data-msg="vkGroup" aria-label="Группа ВКонтакте"><img src="assets/d/ic-vk.svg" width="24" height="24" alt=""></a>
    </div>
    <div class="stickers" data-set="book"></div>
  </div></section>

  <!-- 9. Частые вопросы -->
  <section id="faq" class="scr scene bg-green b9" aria-labelledby="faq-title"><div class="fr">
    <h2 class="h2 b9-title rv" id="faq-title" style="--d:.1s">Частые вопросы</h2>
    <div class="faq-list rv" style="--d:.25s" role="tablist" aria-orientation="vertical" id="faq-list"></div>
    <div class="faq-side rv" style="--d:.4s">
      <div class="faq-card" id="faq-card" role="tabpanel" aria-live="polite">
        <h3 class="faq-q" id="faq-q"></h3>
        <p class="faq-a" id="faq-a"></p>
      </div>
      <div class="faq-more">
        <p>Не нашли ответ? Спросите меня в переписке, отвечу сама.</p>
        <a class="btn btn-red" href="#" data-msg="telegram">Задать вопрос</a>
      </div>
    </div>
    <div class="stickers" data-set="faq"></div>
  </div></section>

  <!-- Подвал: появляется при прокрутке после блока вопросов -->
  <footer class="footer" id="footer">
    <div class="ft-in">
      <div class="ft-col ft-brand">
